version: "3.9"

services:

  # ── 1. Python Worker ──────────────────────────────────────
  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    image: claude-python-worker:latest
    container_name: claude-python-worker
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Europe/Copenhagen
      - NODE_API_URL=http://node-api:3000
    volumes:
      - shared-data:/app/data
      - shared-logs:/app/logs
      - project-files:/workspace
    networks:
      - claude-net
    depends_on:
      - node-api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── 2. Node.js API + GUI ──────────────────────────────────
  node-api:
    build:
      context: ./node-api
      dockerfile: Dockerfile
    image: claude-node-api:latest
    container_name: claude-node-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Copenhagen
      - PYTHON_WORKER_URL=http://python-worker:5000
    ports:
      - "3000:3000"
    volumes:
      - shared-data:/app/data
      - shared-logs:/app/logs
      - project-files:/workspace
    networks:
      - claude-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── 3. VS Code i browseren (code-server) ──────────────────
  vscode:
    image: lscr.io/linuxserver/code-server:latest
    container_name: claude-vscode
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
      - PASSWORD=${VSCODE_PASSWORD:-piagent123}
      - DEFAULT_WORKSPACE=/workspace
    ports:
      - "8080:8443"
    volumes:
      - project-files:/workspace      # Delte projektfiler
      - vscode-config:/config         # VS Code indstillinger
    networks:
      - claude-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  shared-data:
  shared-logs:
  project-files:    # Delt mellem VS Code, Python og Node.js
  vscode-config:

networks:
  claude-net:
    driver: bridge
