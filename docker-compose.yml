version: "3.9"

services:

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    image: claude-python-worker:latest
    container_name: claude-python-worker
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Europe/Copenhagen
      - NODE_API_URL=http://node-api:3000
    volumes:
      - shared-data:/app/data
      - shared-logs:/app/logs
    networks:
      - claude-net
    depends_on:
      - node-api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  node-api:
    build:
      context: ./node-api
      dockerfile: Dockerfile
    image: claude-node-api:latest
    container_name: claude-node-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Copenhagen
      - PYTHON_WORKER_URL=http://python-worker:5000
    ports:
      - "3000:3000"
    volumes:
      - shared-data:/app/data
      - shared-logs:/app/logs
    networks:
      - claude-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  shared-data:
  shared-logs:

networks:
  claude-net:
    driver: bridge
